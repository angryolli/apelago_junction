name: ocean-radar

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/radar.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WATCHFILES_FORCE_POLLING: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-gpt-4.1}
    volumes:
      - ./backend:/app
      - radar_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend/fff13e3f-08a7-4f29-a5c3-4a45fe9371c1
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/fff13e3f-08a7-4f29-a5c3-4a45fe9371c1:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  radar_data:
  frontend_node_modules:
